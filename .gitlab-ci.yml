image: mcr.microsoft.com/dotnet/sdk:8.0

stages:
  - build

before_script:
  - chmod +x srdk
build:
  stage: build
  rules:
    - if: '($CI_COMMIT_MESSAGE !~ /^doc:.*/ && $CI_COMMIT_DESCRIPTION !~ /!noCi/ && $CI_COMMIT_MESSAGE !~ /^chore:.*/) || $CI_COMMIT_DESCRIPTION =~ /!forceCi/'
  script:
    - 'chmod +x ./srdk'
    - './srdk build'
  artifacts:
    paths:
      - '/builds/SiliconWorkGroup/Arcadia/build/'