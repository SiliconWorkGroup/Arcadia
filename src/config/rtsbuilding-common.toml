#Enable RTS Building survival progression, feature unlocks, home anchors, and progression radius limits.
enableSurvivalProgression = true
#When survival progression is enabled, share unlocked progression nodes and RTS home anchors with the player's FTB Team, or vanilla scoreboard team when FTB Teams is unavailable.
shareSurvivalProgressionWithTeams = true
#Maximum RTS action radius in blocks. Used directly when survival progression is disabled, and by the Radius Max skill when survival progression is enabled.
# Default: 128
# Range: 48 ~ 512
maxActionRadiusBlocks = 128
#Enable the RTS blueprint library tab, local blueprint upload, and server-side blueprint placement.
enableBlueprints = true
#Maximum non-air blocks allowed in one RTS blueprint import, capture, or placement job.
# Default: 20000
# Range: 1 ~ 200000
maxBlueprintBlocks = 20000
#Skill material overrides. Format: node_path=minecraft:item:count,minecraft:item2:count. Example: ultimine=minecraft:diamond_pickaxe:1,minecraft:redstone_block:1
progressionCostOverrides = [
    "radius_1=minecraft:piston:8,minecraft:copper_ingot:64,minecraft:iron_ingot:64,redstone:8",
    "radius_2=minecraft:piston:64,minecraft:gold_ingot:64,minecraft:redstone:64",
    "radius_3=minecraft:piston:512,minecraft:diamond:16,minecraft:redstone:128",
    "radius_max=minecraft:beacon:1,minecraft:ender_pearl:16,minecraft:netherite_ingot:1",
    "storage_link=ae2:wireless_terminal:1",
    "remote_place=create:extendo_grip:2",
    "remote_break=minecraft:diamond_pickaxe:1,minecraft:diamond_axe:1,minecraft:diamond_shovel:1,minecraft:diamond_hoe:1,minecraft:diamond_sword:1",
    "rotate_block=minecraft:ender_eye:1",
    "blueprints=create:schematic_and_quill:1,create:schematic_table:1",
    "auto_store_mined=minecraft:hopper:1,spelunkery:item_magnet:1,create_sa:drone_controller:1,create_sa:brass_drone_item:1",
